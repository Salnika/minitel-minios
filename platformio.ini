[platformio]
default_envs = esp32dev

[env:esp32dev]
; Pinned so a fresh checkout builds with the same Arduino core (2.0.17).
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5

upload_speed = 460800
monitor_speed = 115200
; Two 1.9 MB app slots for over-the-air updates; NVS stays at 0x9000 so settings survive.
; Switching partition tables needs one USB flash, OTA cannot rewrite the table.
board_build.partitions = min_spiffs.csv

build_flags =
  -DARDUINO_WRAPPER_NO_SKETCH
  -Isrc/lib_minitel/include

; Exclude bundled library examples from build to avoid extra sketches
build_src_filter = +<*> -<lib_minitel/examples/**>

; Local secrets live in src/app/local_secrets.h (ignored by git).
; Start from src/app/local_secrets.example.h.

; Same firmware with the on-screen texts in English (src/app/lang.h).
[env:esp32dev_en]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DMINIOS_LANG_EN

; Network update from this computer (same Wi-Fi):
;   MINIOS_OTA_PASSWORD=<docs API token> pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = minitel-minios.local
upload_flags =
  --auth=${sysenv.MINIOS_OTA_PASSWORD}

[env:ota_en]
extends = env:ota
build_flags =
  ${env:esp32dev_en.build_flags}

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
build_flags =
  -Isrc
  -Isrc/lib_minitel/include
  -Itest/stubs
build_src_filter = -<*>

; Test-only environment used with `pio test -e native`.
; It is not intended for `pio run`.

; The same tests against the English texts: `pio test -e native_en`.
[env:native_en]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -DMINIOS_LANG_EN
